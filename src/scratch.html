<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dekripsi Dokumen</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link href="./output.css" rel="stylesheet">
    
    <style> body { font-family: 'Quicksand', sans-serif; background: #E6D6FF; } </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">

    <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Dokumen Rahasia 📂</h1>
        <p class="text-gray-600">Sayangggggg, gosok layar abu-abu di bawah ini yakkkk!</p>
    </div>

    <div class="relative w-72 h-40 rounded-xl overflow-hidden shadow-2xl bg-white flex items-center justify-center text-center p-4">
        <div class="absolute inset-0 flex items-center justify-center p-4 z-0">
            <p class="font-bold text-pink-500 text-lg">Kupon: 1x Pelukann atau Kiss</p>
        </div>
        
        <canvas id="scratch-pad" class="absolute inset-0 z-10 w-full h-full cursor-pointer"></canvas>
    </div>

    <button id="next-btn" class="hidden mt-8 bg-pink-500 text-white px-6 py-3 rounded-full font-bold shadow-lg animate-bounce" onclick="window.location.href='evidence.html'">
        Lanjuttt →
    </button>

    <script>
        const canvas = document.getElementById('scratch-pad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        ctx.fillStyle = '#9CA3AF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = "bold 20px Quicksand";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.fillText("GOSOK DI SINI", canvas.width/2, canvas.height/2);


        function scratch(x, y) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e.offsetX, e.offsetY); });
        canvas.addEventListener('mousemove', (e) => { if(isDrawing) scratch(e.offsetX, e.offsetY); });
        canvas.addEventListener('mouseup', () => { isDrawing = false; checkClear(); });

        canvas.addEventListener('touchstart', (e) => { 
            isDrawing = true; 
            let rect = canvas.getBoundingClientRect();
            scratch(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top); 
        });
        canvas.addEventListener('touchmove', (e) => { 
            e.preventDefault(); 
            if(isDrawing) {
                let rect = canvas.getBoundingClientRect();
                scratch(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top); 
            }
        });
        canvas.addEventListener('touchend', () => { isDrawing = false; checkClear(); });

        let cleared = false;
        function checkClear() {
            if(!cleared) {
                document.getElementById('next-btn').classList.remove('hidden');
                cleared = true;
            }
        }
    </script>
</body>
</html>
