<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pos Penjagaan - TOP SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link href="./output.css" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background: linear-gradient(135deg, #FFD1DC, #E6D6FF); }
        .font-mono { font-family: 'Space Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .stempel { transform: rotate(-15deg); border: 4px solid #FF5C8A; color: #FF5C8A; border-radius: 8px; padding: 5px 10px; font-weight: bold; }
    </style>
</head>
<body class="h-screen flex items-center justify-center overflow-hidden">

    <div id="login-box" class="glass p-8 rounded-3xl shadow-xl w-11/12 max-w-md relative flex flex-col items-center">
        <div class="absolute -top-10 -right-6 stempel font-mono opacity-80 text-xl tracking-widest">CLASSIFIED</div>
        
        <div class="text-center mb-6 h-20">
            <p id="typewriter" class="font-mono text-sm text-gray-800"></p>
        </div>

        <input type="password" id="password" placeholder="Siapa nama lengkap VABIO!" class="w-full p-3 rounded-xl border-2 border-pinky focus:outline-none focus:border-cherry mb-6 text-center font-mono">

        <div class="relative w-full h-16 flex justify-center items-center">
            <button id="btn-verifikasi" class="absolute bg-cherry hover:bg-[#FF5C8A] text-[#bf4c61] px-6 py-3 rounded-full font-bold shadow-lg transition-all duration-300">
                Verifikasi
            </button>
        </div>
    </div>

    <!-- Layar Sukses -->
    <div id="success-screen" class="hidden absolute inset-0 bg-cream flex flex-col items-center justify-center z-50 transition-opacity duration-1000 opacity-0">
        <div class="text-6xl mb-4">✅</div>
        <h2 class="font-mono text-2xl text-cherry font-bold text-center">Akses Diterima.<br>Memuat sistem... (Tunggu Sebentar Yakkkkkk)</h2>
    </div>

<script>
        const sandiBenar = "vabio rico afrizan"; 

        // Typewriter Effect
        const text = "⚠️ PERINGATAN! Paket rahasia ini HANYA boleh dibuka oleh Tuan Putri CANTIKAAA. Buktikan identitasmu, SAYANGGGGG";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 40);
            }
        }
        window.onload = typeWriter;

        // Logika Tombol Ngeles
        const btn = document.getElementById('btn-verifikasi');
        const passInput = document.getElementById('password');
        let dodgeCount = 0;
        const buttonTexts = [
            "Verifikasi",
            "Yakin ini kamu? 🤨",
            "Coba senyum dulu dong 😌",
            "Imposter nih pasti! 🕵️",
            "Iya deh percaya, Verifikasi 🥵"
        ];
        function getCleanInput() {
            return passInput.value.trim().toLowerCase();
        }

        const cleanSandiBenar = sandiBenar.trim().toLowerCase();

        btn.addEventListener('mouseover', function() {
            if (getCleanInput() === cleanSandiBenar) return; 
            if (dodgeCount < 4) {
                dodgeCount++;
                btn.innerText = buttonTexts[dodgeCount];
                const x = (Math.random() - 0.5) * 150;
                const y = (Math.random() - 0.5) * 100;
                btn.style.transform = `translate(${x}px, ${y}px)`;
            } else {
                btn.style.transform = `translate(0px, 0px)`;
            }
        });

        btn.addEventListener('click', function() {
            if (getCleanInput() === cleanSandiBenar) {
                document.getElementById('login-box').style.display = 'none';
                const success = document.getElementById('success-screen');
                success.classList.remove('hidden');
                setTimeout(() => success.classList.remove('opacity-0'), 50);
                setTimeout(() => { window.location.href = 'quiz.html'; }, 3000);
            } else {
                if (passInput.value === "") {
                    alert("Isi sandi dulu dong, Sayanggggg");
                } else { 
                    alert("Sandi salah! Coba ingat-ingat lagi ishh SAYANGGGGG");
                }
            }
        });
    </script>
</body>
</html>
